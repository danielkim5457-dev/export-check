services:
  api:
    build: ./api
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [mongo, qdrant]
  web:
    build: ./web
    ports: ["5173:5173"]
    depends_on: [api]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports: ["6333:6333"]
